name: fast-deploy-trigger

on:
  workflow_call:
    inputs:
      app:
        type: string
        required: true
      agent-url:
        type: string
        required: true
    secrets:
      deploy-secret:
        required: true

jobs:
  trigger:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger fast deploy
        run: |
          curl -sf -X POST "${{ inputs.agent-url }}/deploy/${{ inputs.app }}/fast" \
            -H "Authorization: Bearer ${{ secrets.deploy-secret }}" \
            || echo "fast deploy trigger failed, periodic tick will catch up"
