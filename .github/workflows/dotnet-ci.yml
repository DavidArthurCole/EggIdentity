name: dotnet-ci

on:
  workflow_call:
    inputs:
      solution:
        required: true
        type: string
      dotnet-version:
        type: string
        default: "10.0.x"
      packages-auth:
        type: boolean
        default: false
      format-gate:
        type: boolean
        default: false
      razor-include:
        type: string
        default: "src/**/*.razor"
    secrets:
      PACKAGES_PAT:
        required: false

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: ${{ inputs.dotnet-version }}

      - uses: actions/cache@v6
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/*.csproj', '**/Directory.Build.props') }}
          restore-keys: ${{ runner.os }}-nuget-

      - name: Authenticate GitHub Packages
        if: inputs.packages-auth
        run: |
          dotnet nuget update source github \
            --username ${{ github.repository_owner }} \
            --password ${{ secrets.PACKAGES_PAT }} \
            --store-password-in-clear-text \
            --configfile nuget.config

      - name: Test
        run: dotnet test ${{ inputs.solution }} -c Release

      - name: Verify formatting
        if: inputs.format-gate
        run: dotnet format ${{ inputs.solution }} --verify-no-changes

      - name: Install ReSharper CLI
        if: inputs.format-gate
        run: dotnet tool install -g JetBrains.ReSharper.GlobalTools

      - name: Verify Razor formatting
        if: inputs.format-gate
        run: |
          jb cleanupcode ${{ inputs.solution }} --include="${{ inputs.razor-include }}"
          git diff --exit-code -- '*.razor' || (echo "::error::Razor files are not formatted. Run 'jb cleanupcode ${{ inputs.solution }} --include=\"${{ inputs.razor-include }}\"' locally." && exit 1)
