name: docker-publish

on:
  workflow_call:
    inputs:
      push:
        type: boolean
        default: true
      image-suffix:
        type: string
        default: ""
      context:
        type: string
        default: "."
      dockerfile:
        type: string
        default: "Dockerfile"
      build-args:
        type: string
        default: ""
      needs-pat:
        type: boolean
        default: false
      tags-mode:
        type: string
        default: "release-tag"
      version-build-arg:
        type: string
        default: ""
      cache-scope:
        type: string
        default: "default"
    secrets:
      PACKAGES_PAT:
        required: false

jobs:
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Compute image metadata
        id: meta
        run: |
          NAME="ghcr.io/${GITHUB_REPOSITORY,,}${{ inputs.image-suffix }}"
          VERSION=""
          case "$GITHUB_REF" in refs/tags/*) VERSION="${GITHUB_REF_NAME#v}" ;; esac
          if [ "${{ inputs.tags-mode }}" = "latest-sha" ]; then
            TAGS="${NAME}:latest,${NAME}:${GITHUB_SHA}"
          else
            TAGS="${NAME}:${GITHUB_REF_NAME},${NAME}:latest"
          fi
          echo "name=$NAME" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tags=$TAGS" >> "$GITHUB_OUTPUT"

      - name: Build and push image
        uses: docker/build-push-action@v7
        with:
          context: ${{ inputs.context }}
          file: ${{ inputs.dockerfile }}
          push: ${{ inputs.push }}
          pull: true
          provenance: false
          build-args: |
            GIT_SHA=${{ github.sha }}
            APP_VERSION=${{ steps.meta.outputs.version }}
            ${{ inputs.build-args }}
            ${{ inputs.version-build-arg != '' && format('{0}={1}', inputs.version-build-arg, steps.meta.outputs.version) || '' }}
          secrets: ${{ inputs.needs-pat && format('github_token={0}', secrets.PACKAGES_PAT) || '' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: |
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
          cache-from: type=registry,ref=${{ steps.meta.outputs.name }}:buildcache
          cache-to: type=registry,ref=${{ steps.meta.outputs.name }}:buildcache,mode=max
